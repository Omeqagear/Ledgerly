services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerly-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ledgerly
      - SPRING_DATASOURCE_USERNAME=ledgerly
      - SPRING_DATASOURCE_PASSWORD=ledgerly_secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_CACHE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ledgerly-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledgerly-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ledgerly-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ledgerly-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ledgerly-redis
    ports:
      - "6379:6379"
    networks:
      - ledgerly-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  ledgerly-network:
    driver: bridge