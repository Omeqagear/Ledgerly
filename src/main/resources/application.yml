spring:
  application:
    name: ledgerly

  profiles:
    active: dev

  datasource:
    url: ${LEDGERLY_DB_URL:jdbc:postgresql://localhost:5432/ledgerly}
    username: ${LEDGERLY_DB_USER:ledgerly}
    password: ${LEDGERLY_DB_PASS:ledgerly_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: DELETE
      jdbc:
        schema-initialization:
          enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.modulith: INFO
    org.hibernate.SQL: WARN

ledgerly:
  jwt:
    secret: ${LEDGERLY_JWT_SECRET:Zm9vYmFyLXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctYWxnb3JpdGht}
    expiration-minutes: 30
  seed:
    admin-username: ${LEDGERLY_SEED_ADMIN_USERNAME:admin}
    admin-password: ${LEDGERLY_SEED_ADMIN_PASSWORD:ledgerly}